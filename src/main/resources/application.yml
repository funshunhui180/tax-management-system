server:
  # 8080 被其他进程占用（netstat 显示 PID 27820 监听），改用 8081 启动
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: tax-system
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tax_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地 MySQL 8.1 的 root 密码实测为 root（原 123456 会报 Access denied for user 'root'@'localhost'）
    # 可通过环境变量 DB_PASSWORD 覆盖，避免把明文密码推到 GitHub
    password: "${DB_PASSWORD:root}"
  # Thymeleaf 配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
  # Jackson 时间序列化格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus 配置
mybatis-plus:
  # mapper XML 文件位置（如使用 XML 映射）
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.tax.entity
  configuration:
    # 开启驼峰命名自动映射（数据库列下划线 -> 实体驼峰）
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发环境开启，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.example.tax: debug
