<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无权访问 - 税务业务基础管理系统</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
</head>
<body class="error-page">
<main class="error-card">
    <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            <path d="M12 14v2"/>
        </svg>
    </div>
    <div class="error-code">403 FORBIDDEN</div>
    <h1>无权访问</h1>
    <p class="desc">当前账号没有访问该页面的权限。<br>如需办理相关业务，请返回首页，或使用具备相应权限的账号登录。</p>

    <p class="error-path" th:if="${path != null}">
        请求地址：<code th:text="${path}">/taxpayer/list</code>
    </p>

    <p class="error-meta" th:if="${session.loginUser != null}">
        当前登录账号：<b th:text="${session.loginUser.username}">user</b>
        <span th:if="${session.loginUser.role == 0}">（管理员）</span>
        <span th:if="${session.loginUser.role == 1}">（审核员）</span>
        <span th:if="${session.loginUser.role == 2}">（纳税人）</span>
    </p>

    <div class="error-actions">
        <a class="btn btn-primary" th:href="@{/}">返回首页</a>
        <a class="btn" th:href="@{/logout}">退出登录</a>
    </div>
</main>
</body>
</html>
