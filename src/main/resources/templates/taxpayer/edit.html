<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${taxpayer.id == null ? '新增纳税人' : '编辑纳税人'})}"></head>
<body>
<div class="app">
    <div th:replace="~{layout :: sidebar('taxpayer')}"></div>

    <div class="main">
        <main class="content">
            <header class="page-head">
                <div>
                    <div class="crumbs">
                        <a th:href="@{/}">首页</a>
                        <span class="sep">/</span>
                        <a th:href="@{/taxpayer/list}">纳税人管理</a>
                        <span class="sep">/</span>
                        <span th:text="${taxpayer.id == null ? '新增' : '编辑'}">新增</span>
                    </div>
                    <h1 th:text="${taxpayer.id == null ? '新增纳税人' : '编辑纳税人'}">新增纳税人</h1>
                    <p class="subtitle">维护企业识别信息、联系方式与登记状态</p>
                </div>
            </header>

            <div class="form-shell">
                <form class="card form-card" th:action="@{/taxpayer/save}" th:object="${taxpayer}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-head">
                        <span class="form-head-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 21V5.5A2.5 2.5 0 0 1 6.5 3H14a2 2 0 0 1 2 2v16"/>
                                <path d="M16 9h2.5A1.5 1.5 0 0 1 20 10.5V21"/>
                                <path d="M2 21h20"/>
                                <path d="M7.5 7.5h4M7.5 11h4M7.5 14.5h4"/>
                            </svg>
                        </span>
                        <div>
                            <h2 th:text="${taxpayer.id == null ? '纳税人基础信息' : '修改纳税人信息'}">纳税人基础信息</h2>
                            <p>带 <span class="req">*</span> 的字段为必填项，请确保识别号唯一。</p>
                        </div>
                    </div>

                    <div class="form-body">
                        <div class="form-section">
                            <h3 class="form-section-title">登记信息</h3>
                            <div class="form-grid">
                                <div class="field">
                                    <label for="taxpayerIdentifyNo">纳税人识别号 <span class="req">*</span></label>
                                    <input class="input" type="text" id="taxpayerIdentifyNo"
                                           th:field="*{taxpayerIdentifyNo}" required autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="companyName">企业名称 <span class="req">*</span></label>
                                    <input class="input" type="text" id="companyName"
                                           th:field="*{companyName}" required autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="legalRepresentative">法定代表人</label>
                                    <input class="input" type="text" id="legalRepresentative"
                                           th:field="*{legalRepresentative}" autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="contactPhone">联系电话</label>
                                    <input class="input" type="text" id="contactPhone"
                                           th:field="*{contactPhone}" autocomplete="off">
                                </div>
                                <div class="field is-full">
                                    <label for="registerAddress">注册地址</label>
                                    <input class="input" type="text" id="registerAddress"
                                           th:field="*{registerAddress}" placeholder="省 / 市 / 区及详细地址"
                                           autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="industryType">行业类型</label>
                                    <input class="input" type="text" id="industryType"
                                           th:field="*{industryType}" placeholder="如：信息技术服务" autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="registrationStatus">登记状态</label>
                                    <select class="select" id="registrationStatus" th:field="*{registrationStatus}">
                                        <option value="正常">正常</option>
                                        <option value="停用">停用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12.5 9.5 17 19 7.5"/>
                            </svg>
                            保存
                        </button>
                        <a class="btn" th:href="@{/taxpayer/list}">返回列表</a>
                        <span class="spacer"></span>
                        <span class="tip">保存后将自动返回纳税人列表</span>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
