<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title th:text="${title}">税务业务基础管理系统</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=2)}">
</head>

<!-- 左侧导航菜单片段：sidebar(active)，active 为当前高亮的模块标识 -->
<aside th:fragment="sidebar(active)" class="sidebar"
       th:with="role=${session.loginUser != null ? session.loginUser.role : -1}">
    <div class="sidebar-brand">
        <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 4 7v5c0 4.5 3.2 7.6 8 9 4.8-1.4 8-4.5 8-9V7l-8-4Z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </span>
        <span class="brand-text">
            <strong>税务业务管理系统</strong>
            <small>TAX ADMIN CONSOLE</small>
        </span>
    </div>

    <div class="sidebar-user">
        <span class="sidebar-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>
        </span>
        <span class="sidebar-user-meta">
            <span class="sidebar-user-name"
                  th:text="${session.loginUser != null ? session.loginUser.username : '-'}">admin</span>
            <span class="sidebar-user-role"
                  th:text="${role == 0 ? '管理员' : (role == 1 ? '审核员' : (role == 2 ? '纳税人' : '未知角色'))}">管理员</span>
        </span>
    </div>

    <nav class="nav">
        <a th:classappend="${active == 'home'} ? 'is-active' : ''" th:href="@{/}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 10.5 9-7.5 9 7.5"/>
                <path d="M5 9.5V21h14V9.5"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
            <span>系统首页</span>
        </a>
        <a th:if="${role == 0}"
           th:classappend="${active == 'taxpayer'} ? 'is-active' : ''"
           th:href="@{/taxpayer/list}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 21V5.5A2.5 2.5 0 0 1 6.5 3H14a2 2 0 0 1 2 2v16"/>
                <path d="M16 9h2.5A1.5 1.5 0 0 1 20 10.5V21"/>
                <path d="M2 21h20"/>
                <path d="M7.5 7.5h4M7.5 11h4M7.5 14.5h4"/>
            </svg>
            <span>纳税人管理</span>
        </a>
        <a th:classappend="${active == 'declaration'} ? 'is-active' : ''"
           th:href="@{/declaration/list}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8l-5-5Z"/>
                <path d="M14 3v5h5"/>
                <path d="M8.5 13h7M8.5 16.5h4.5"/>
            </svg>
            <span>申报管理</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a class="sidebar-logout" th:href="@{/logout}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <path d="m16 17 5-5-5-5"/>
                <path d="M21 12H9"/>
            </svg>
            <span>退出登录</span>
        </a>
    </div>
</aside>

<!-- 闪现提示消息片段：flash(msg) -->
<div th:fragment="flash(msg)" th:if="${msg}" class="flash" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="m8 12 2.5 2.5L16 9"/>
    </svg>
    <span th:text="${msg}">操作成功</span>
</div>

</body>
</html>
